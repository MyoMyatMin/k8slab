server {
    listen 8080;
    listen [::]:8080;

    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src http://127.0.0.1:8000 http://localhost:8000; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /app.js {
        try_files $uri =404;
    }

    location = /styles.css {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}