apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reliability-route
  namespace: reliability
spec:
  parentRefs:
    - name: reliability-gateway
      sectionName: http

  hostnames:
    - reliability.localhost

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8000

    - matches:
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: api
          port: 8000

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
