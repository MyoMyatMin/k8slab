apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reliability-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: reliability-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: reliability
      ports:
        - protocol: TCP
          port: 8000
