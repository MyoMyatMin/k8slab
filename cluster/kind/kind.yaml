kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8slab
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
    labels:
      reliability.dev/workload: "true"
  - role: worker
    labels:
      reliability.dev/workload: "true"
